<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing starter</title>
  <!-- Lenis CSS: required -->
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.27/dist/lenis.css">
  <style>
    :root { --bg: #0b1020; --fg: #f4f4f8; --muted: #a3a8c3; --accent: #7c5cff; }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--fg); font: 18px/1.5 system-ui, sans-serif; }
    .hero { position: relative; min-height: 100svh; display: grid; place-items: center; background: var(--bg); overflow: hidden; }
    .hero__content { position: relative; z-index: 1; text-align: center; padding: 0 16px; }
    .hero h1 { font-size: clamp(2.5rem, 8vw, 6rem); line-height: 1.05; max-width: 14ch; margin-inline: auto; }
    .hero p { color: var(--muted); margin: 1rem 0 2rem; }
    .btn { display: inline-block; padding: .9rem 1.6rem; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; }
    section.block { min-height: 80vh; padding: 15vh 16px; max-width: 1100px; margin: 0 auto; }
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
    .card { padding: 32px; border-radius: 20px; background: #161c33; }
    .pin { min-height: 100vh; display: grid; place-items: center; overflow: hidden; }
    .pin h2 { font-size: clamp(2rem, 6vw, 4.5rem); }
    /* FOUC guard: GSAP reveals these */
    .js .reveal, .js .hero__content { visibility: hidden; }
  </style>
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <section id="hero" class="hero">
    <div class="hero__content">
      <h1 class="headline">Motion that feels expensive</h1>
      <p>Lenis smooth scroll, GSAP animations, Vanta background.</p>
      <a class="btn" href="#features">See features</a>
    </div>
  </section>

  <section id="features" class="block">
    <div class="features">
      <div class="card reveal"><h3>Smooth</h3><p>Lenis interpolates every wheel tick.</p></div>
      <div class="card reveal"><h3>Precise</h3><p>GSAP timelines and ScrollTrigger.</p></div>
      <div class="card reveal"><h3>Alive</h3><p>Vanta renders a WebGL hero.</p></div>
    </div>
  </section>

  <section class="pin">
    <h2 class="pin__title">Scroll to scale me</h2>
  </section>

  <section class="block"><h2 class="reveal">The end</h2></section>

  <!-- Libraries (pinned) -->
  <script src="https://unpkg.com/lenis@1.3.27/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/SplitText.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger, SplitText)
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches

    // 1. Lenis driven by GSAP's ticker (one rAF driver only)
    const lenis = new Lenis({ anchors: true })
    lenis.on('scroll', ScrollTrigger.update)
    gsap.ticker.add((t) => lenis.raf(t * 1000))
    gsap.ticker.lagSmoothing(0)

    // 2. Vanta hero (skipped for reduced motion; CSS background stays)
    let vanta = null
    if (!reduce && window.VANTA) {
      vanta = VANTA.NET({
        el: '#hero', color: 0x7c5cff, backgroundColor: 0x0b1020,
        points: matchMedia('(max-width: 768px)').matches ? 6 : 10, maxDistance: 22, spacing: 16,
      })
    }

    // 3. GSAP animations, with a reduced-motion branch
    const mm = gsap.matchMedia()
    mm.add({ motion: '(prefers-reduced-motion: no-preference)', reduce: '(prefers-reduced-motion: reduce)' }, (ctx) => {
      if (ctx.conditions.reduce) { gsap.set('.reveal, .hero__content', { autoAlpha: 1 }); return }

      gsap.set('.hero__content', { autoAlpha: 1 })
      document.fonts.ready.then(() => {
        SplitText.create('.headline', {
          type: 'lines', mask: 'lines', autoSplit: true,
          onSplit: (self) => gsap.from(self.lines, { yPercent: 100, duration: 1, stagger: 0.1, ease: 'expo.out' }),
        })
      })
      gsap.from('.hero p, .hero .btn', { y: 20, autoAlpha: 0, duration: 0.8, stagger: 0.1, delay: 0.5, ease: 'power3.out' })

      // hero copy drifts out on scroll
      gsap.to('.hero__content', {
        yPercent: -30, autoAlpha: 0, ease: 'none',
        scrollTrigger: { trigger: '#hero', start: 'top top', end: 'bottom top', scrub: true },
      })

      // batch reveal
      gsap.set('.reveal', { y: 40 })
      ScrollTrigger.batch('.reveal', {
        start: 'top 85%',
        onEnter: (els) => gsap.to(els, { autoAlpha: 1, y: 0, stagger: 0.12, duration: 0.8, ease: 'power3.out', overwrite: true }),
      })

      // pinned scrub
      gsap.fromTo('.pin__title', { scale: 0.6 }, {
        scale: 1.6, ease: 'none',
        scrollTrigger: { trigger: '.pin', start: 'top top', end: '+=150%', scrub: 1, pin: true },
      })
    })
  </script>
</body>
</html>
